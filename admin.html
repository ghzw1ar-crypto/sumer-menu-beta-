<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sumer Menu - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5;color:#222}.wrap{max-width:1000px;margin:auto;padding:16px}
.card{background:white;padding:18px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 12px #0001}
input,button{width:100%;padding:11px;margin:5px 0;border-radius:9px;border:1px solid #ddd;font-size:16px;box-sizing:border-box}
button{background:#111;color:white;border:0;font-weight:bold}.danger{background:#b00020}.gray{background:#666}.green{background:#16833b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid #eee;padding:12px;border-radius:12px;margin:10px 0}.item img{width:70px;height:70px;object-fit:cover;float:right;margin-left:10px;border-radius:8px}.clear{clear:both}
.hidden{display:none}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top button{width:auto;padding:9px 14px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.top{align-items:flex-start}}
</style>

<style>
.delivery-card{margin-top:16px}
.delivery-list{display:grid;gap:8px;margin-top:10px}
.delivery-item{display:flex;align-items:center;gap:8px;border:1px solid #eee;padding:10px;border-radius:12px;background:#fff}
.delivery-item .info{flex:1}
.delivery-item .name{font-weight:800}
.delivery-item .fee{color:#666;font-size:14px;margin-top:3px}
.delivery-item button{width:auto;margin:0;padding:8px 12px}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="card">
<h2>🍽️ Sumer Menu — تسجيل الدخول</h2>
<input id="email" type="email" placeholder="الإيميل">
<input id="password" type="password" placeholder="كلمة السر">
<button onclick="login()">دخول</button>
<div id="loginMsg"></div>
</div>

<div id="panel" class="hidden">
<div class="card top"><div><h2>لوحة تحكم Sumer Menu</h2><small>إدارة الأصناف من Supabase</small></div><button class="gray" onclick="logout()">خروج</button></div>

<div class="card">
<h3 id="title">➕ إضافة صنف</h3>
<input id="editId" type="hidden">
<div class="grid">
<input id="name" placeholder="اسم الصنف">
<input id="price" type="number" placeholder="السعر">
<input id="category" placeholder="القسم">
<input id="image_url" placeholder="رابط الصورة">
</div>
<label><input id="available" type="checkbox" checked style="width:auto"> متوفر</label>
<button class="green" onclick="save()">حفظ</button>
<button class="gray" onclick="clearForm()">إلغاء</button>
<div id="msg"></div>
</div>

<div class="card delivery-card">
<h3>🚚 مناطق التوصيل</h3>
<p>أضف المناطق وسعر التوصيل، وستظهر للزبون في المنيو.</p>
<div class="grid">
<input id="deliveryName" placeholder="اسم المنطقة — مثال: حي سومر">
<input id="deliveryFee" type="number" min="0" placeholder="أجور التوصيل بالدينار">
</div>
<button class="green" onclick="addDelivery()">➕ إضافة منطقة</button>
<div id="deliveryMsg"></div>
<div id="deliveryList" class="delivery-list"></div>
</div>

<div class="card">
<div class="top"><h3>📋 الأصناف</h3><button onclick="load()">تحديث</button></div>
<div id="count"></div>
<div id="items">جارٍ التحميل...</div>
</div>
</div>
</div>

<script>
const SUPABASE_URL="https://glbugvsorxtzixgexdak.supabase.co";
const SUPABASE_KEY="sb_publishable_8iv3CIQ3MaQ6E9oPgK6N8A_KTYGp-V6";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function login(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 const {error}=await db.auth.signInWithPassword({email,password});
 document.getElementById("loginMsg").textContent=error?"❌ "+error.message:"";
 if(!error)show();
}
async function logout(){await db.auth.signOut();location.reload()}
function show(){document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");load()}
async function load(){
 const box=document.getElementById("items");
 const {data,error}=await db.from("menu_items").select("*").neq("category",DELIVERY_CATEGORY).order("id");
 if(error){box.textContent="❌ "+error.message;return}
 document.getElementById("count").textContent="عدد الأصناف: "+data.length;
 box.innerHTML=data.map(x=>`<div class="item">
 ${x.image_url?`<img src="${esc(x.image_url)}">`:""}
 <b>${esc(x.name||"")}</b><br>💰 ${x.price??""}<br>📂 ${esc(x.category||"")}<br>
 ${x.available?"🟢 متوفر":"🔴 غير متوفر"}
 <div class="clear"></div>
 <div class="actions">
 <button onclick='edit(${JSON.stringify(x)})'>تعديل</button>
 <button class="${x.available?"gray":"green"}" onclick="toggle(${x.id},${x.available})">${x.available?"إيقاف":"تشغيل"}</button>
 <button class="danger" onclick="del(${x.id})">حذف</button>
 </div></div>`).join("");
}
function edit(x){
 document.getElementById("editId").value=x.id;document.getElementById("name").value=x.name||"";
 document.getElementById("price").value=x.price??"";document.getElementById("category").value=x.category||"";
 document.getElementById("image_url").value=x.image_url||"";document.getElementById("available").checked=!!x.available;
 document.getElementById("title").textContent="✏️ تعديل الصنف رقم "+x.id;scrollTo(0,0)
}
function clearForm(){
 ["editId","name","price","category","image_url"].forEach(id=>document.getElementById(id).value="");
 document.getElementById("available").checked=true;document.getElementById("title").textContent="➕ إضافة صنف";
}
async function save(){
 const id=document.getElementById("editId").value;
 const obj={name:document.getElementById("name").value.trim(),price:Number(document.getElementById("price").value),
 category:document.getElementById("category").value.trim(),image_url:document.getElementById("image_url").value.trim(),
 available:document.getElementById("available").checked};
 if(!obj.name){document.getElementById("msg").textContent="❌ اكتب اسم الصنف";return}
 const r=id?await db.from("menu_items").update(obj).eq("id",id):await db.from("menu_items").insert(obj);
 document.getElementById("msg").textContent=r.error?"❌ "+r.error.message:"✅ تم الحفظ";
 if(!r.error){clearForm();load()}
}
async function toggle(id,current){const r=await db.from("menu_items").update({available:!current}).eq("id",id);if(r.error)alert(r.error.message);load()}
async function del(id){if(!confirm("متأكد من حذف الصنف؟"))return;const r=await db.from("menu_items").delete().eq("id",id);if(r.error)alert(r.error.message);load()}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
db.auth.getSession().then(({data})=>{if(data.session)show()});

const DELIVERY_CATEGORY="__delivery_area__";

async function loadDelivery(){
 const box=document.getElementById("deliveryList");
 const {data,error}=await db.from("menu_items").select("*").eq("category",DELIVERY_CATEGORY).order("id");
 if(error){box.innerHTML="❌ "+esc(error.message);return;}
 box.innerHTML=(data||[]).map(x=>`
 <div class="delivery-item">
   <div class="info"><div class="name">${esc(x.name)}</div><div class="fee">${Number(x.price)||0} د.ع</div></div>
   <button class="gray" onclick="editDelivery(${x.id},${JSON.stringify(x.name)},${Number(x.price)||0})">تعديل</button>
   <button class="danger" onclick="deleteDelivery(${x.id})">حذف</button>
 </div>`).join("") || "<small>لا توجد مناطق مضافة.</small>";
}

async function addDelivery(){
 const name=document.getElementById("deliveryName").value.trim();
 const fee=Number(document.getElementById("deliveryFee").value);
 if(!name || !Number.isFinite(fee) || fee<0){alert("اكتب اسم المنطقة وأجور التوصيل");return;}
 const {data:exists}=await db.from("menu_items").select("id").eq("category",DELIVERY_CATEGORY).eq("name",name).limit(1);
 if(exists&&exists.length){alert("هذه المنطقة موجودة مسبقاً");return;}
 const {error}=await db.from("menu_items").insert({name,price:Math.round(fee),category:DELIVERY_CATEGORY,available:true});
 if(error){alert("❌ "+error.message);return;}
 document.getElementById("deliveryName").value="";
 document.getElementById("deliveryFee").value="";
 document.getElementById("deliveryMsg").textContent="✅ تم إضافة المنطقة";
 loadDelivery();
}

async function editDelivery(id,name,fee){
 const n=prompt("اسم المنطقة",name); if(n===null)return;
 const f=prompt("أجور التوصيل بالدينار",fee); if(f===null)return;
 const price=Number(f);
 if(!n.trim()||!Number.isFinite(price)||price<0){alert("البيانات غير صحيحة");return;}
 const {error}=await db.from("menu_items").update({name:n.trim(),price:Math.round(price),category:DELIVERY_CATEGORY,available:true}).eq("id",id);
 if(error)alert("❌ "+error.message); else loadDelivery();
}

async function deleteDelivery(id){
 if(!confirm("حذف منطقة التوصيل؟"))return;
 const {error}=await db.from("menu_items").delete().eq("id",id);
 if(error)alert("❌ "+error.message); else loadDelivery();
}

loadDelivery();
</script>
</body>
</html>
